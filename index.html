<script>
const Pi = window.Pi;
Pi.init({ version: "2.0" });

async function login(){
  try{
    const scopes = ['username', 'payments'];
    const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
    document.getElementById('user').innerHTML = 
      `<h3>Welcome @${auth.user.username}!</h3>
       <p style="color:#0f0">✅ Wallet Connected</p>
       <button class="btn" onclick="startMining()">Start Mining 5LIFE</button>`;
    
  }catch(e){ alert("Login failed: " + e.message); }
}

function onIncompletePaymentFound(payment){ console.log("Incomplete", payment); }

function share(){
  if(navigator.share){ 
    navigator.share({title:'5LIFE GEO', url:'https://fivelifegeo5.github.io'}); 
  } else { 
    alert('Share: https://fivelifegeo5.github.io'); 
  }
}

function startMining(){
  alert("Mining started for @geovaniepascual! Location-based mining coming soon!");
}
</script>
